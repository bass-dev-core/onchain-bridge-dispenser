version: 2
updates:
  # Update GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10

  # Update npm dependencies for the frontend module
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'daily'
    versioning-strategy: 'auto'
    open-pull-requests-limit: 10
    allow:
      - dependency-type: 'all'

  # Update npm dependencies for the backend module
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'daily'
    versioning-strategy: 'auto'
    open-pull-requests-limit: 10
    allow:
      - dependency-type: 'all'
    rebase-strategy: 'auto'
    merge:
      automerge: true
      commit-message:
        prefix: 'chore'
        include: 'scope'

  # Update npm dependencies for the market-maker module
  - package-ecosystem: 'npm'
    directory: '/market-maker'
    schedule:
      interval: 'daily'
    versioning-strategy: 'auto'
    open-pull-requests-limit: 10
    allow:
      - dependency-type: 'all'
    rebase-strategy: 'auto'
